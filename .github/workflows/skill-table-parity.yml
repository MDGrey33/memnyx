name: skill-table parity

# Two jobs gated on the same `.claude/skills/**` trigger:
#   parity                 — fails a PR if the on-disk skill set drifts from
#                             the skill tables in README.md, CLAUDE.md, and
#                             the generated-workspace template. See
#                             scripts/check_skill_tables.py for the rationale.
#                             Also runs scripts/validate_code_auditor.py, which
#                             checks that skill's internal contracts still close
#                             (its agents' vocabularies against the files that
#                             consume them). Its own self-test runs in the job
#                             below, so a gate that stops being able to fail is
#                             caught rather than trusted.
#   setup-workspace-tests   — regression tests for the setup-workspace scripts
#                             (add_project.py CLAUDE.md generate/patch behavior,
#                             fork-overlay source resolution) and the parity
#                             checker's union logic. See the test_*.py files under
#                             .claude/skills/setup-workspace/scripts/ and scripts/.

# Least-privilege: both jobs only check out the repo and run a script,
# so read-only access to contents is all either needs.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".claude/skills/**"
      - "README.md"
      - "CLAUDE.md"
      - "scripts/**"
  push:
    branches: [main]

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check skill-table parity
        run: python3 scripts/check_skill_tables.py
      - name: Check code-auditor package structure
        run: python3 scripts/validate_code_auditor.py

  setup-workspace-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Test setup-workspace + parity-checker scripts
        run: pytest .claude/skills/setup-workspace/scripts/ scripts/ -v
